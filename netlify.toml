[build]
  functions = "netlify/functions/bundled"
  publish = "public"

[build.environment]
  NODE_VERSION = "18" # Correct way to set Node.js version

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["playwright", "@sparticuz/chromium"]

[functions."*"]
  timeout = 30

[functions.checkForApprovals]
  schedule = "@daily"

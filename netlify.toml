[build]
  functions = "netlify/functions/bundled"
  publish = "public"

[build.environment]
  NODE_VERSION = "18" # Correct way to set Node.js version

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "webflow-api",
    "bufferutil",
    "utf-8-validate",
    "@sparticuz/chromium",
    "yargs",
    "yargs-parser",
    "puppeteer-core",
    "puppeteer",
    "node-fetch",
    "kind-of"
  ]

[functions."*"]
  timeout = 30

[functions.checkForApprovals]
  schedule = "@daily"
